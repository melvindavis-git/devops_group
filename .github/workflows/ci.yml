name: CI

on:
  push:
    branches: [ master ]
    tags: ['v*']
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test_and_build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [21]

    # When not using test containers:
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: bookingdb
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up java environment
        uses: actions/setup-java@v6
        with:
          java-version: ${{matrix.java}}
          distribution: "temurin"
          cache: "maven"

      - name: Test with Maven
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bookingdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
      - name: Build with Maven
        run: mvn -B package -DskipTests


  build_and_push_docker:
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:staging \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:${{github.sha}} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: | 
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:staging
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:${{github.sha}}

  deploy-to-staging:
    needs: build_and_push_docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      SERVICE: devops_group
      RAILWAY_TOKEN: ${{secrets.RAILWAY_TOKEN_STAGING}}
    steps:
      - uses: actions/checkout@v7
      - run: railway up --service=${{env.SERVICE}} --environment=staging --yes


  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Tagging image with production
        run: |
          docker buildx imagetools create \
            -t mndavis/devops_group:production \
            -t mndavis/devops_group:${{github.ref_name}} \
             mndavis/devops_group:${{github.sha}}
     

  deploy-top-roduction:
    needs: tag-release
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
     SERVICE: devops_group
     RAILWAY_TOKEN: ${{secrets.RAILWAY_TOKEN_PRODUCTION}}
    steps:
      - uses: actions/checkout@v7
      - run: railway up --service=${{env.SERVICE}} --environment=production --yes


