name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test_and_build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [21]

    # When not using test containers:
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: bookingdb
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up java environment
        uses: actions/setup-java@v6
        with:
          java-version: ${{matrix.java}}
          distribution: "temurin"
          cache: "maven"

      - name: Test with Maven
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/bookingdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
      - name: Build with Maven
        run: mvn -B package -DskipTests


  build_and_push_docker:
    needs: test_and_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:${{github.sha}} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: | 
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops_group:${{github.sha}}

