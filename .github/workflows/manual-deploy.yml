name: Manual deployment
on:
  workflow_dispatch:
   inputs:
     environment:
       description: Select environment
       type: choice
       required: true
       options:
         - staging
         - production
     image:
       description: Which image to deploy (SHA or TAG)
       type: string
       required: true

permissions:
  contents: read

jobs:
  switch-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Tagging image with production
        run: |
          docker buildx imagetools create \
            -t mndavis/devops_group:${{inputs.environment}} \
             mndavis/devops_group:${{inputs.image}}

  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      SERVICE: devops_group
      RAILWAY_TOKEN: ${{inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING}}
    steps:
      - uses: actions/checkout@7
      - run: railway up --service=${{env.SERVICE}} --environment=${{inputs.environment}} --yes
