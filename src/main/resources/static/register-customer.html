<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pensionat - Registrera kund</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <nav>
      <span class="brand">Pensionat</span>
      <a href="/index.html" data-nav>Start</a>
      <a href="/customers.html" data-nav>Kunder</a>
      <a href="/rooms.html" data-nav>Rum</a>
      <a href="/bookings.html" data-nav>Bokningar</a>
      <a
        href="/leave-review.html"
        class="nav-icon"
        title="Lämna en recension"
        aria-label="Lämna en recension"
        style="margin-left: auto; opacity: 0.55; font-size: 0.8rem; text-decoration: none; color: var(--text);"
        >✎</a
      >
    </nav>
  </header>
  <main>
    <h1>Registrera ny kund</h1>
    <div id="alert"></div>

    <form id="form" class="card">
      <label>
        Namn
        <input type="text" name="name" required minlength="2" maxlength="20" />
      </label>
      <label>
        E-post
        <input type="email" name="email" required minlength="10" maxlength="40" />
      </label>
      <label>
        Telefon
        <input type="tel" name="phone" required minlength="2" maxlength="20" />
      </label>
      <div class="actions">
        <button type="submit">Registrera</button>
        <a class="btn btn-secondary" href="/customers.html">Avbryt</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const alertBox = document.getElementById("alert");
    const form = document.getElementById("form");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      try {
        await Api.postJson("/api/customers/register", data, {
          400: "Kunde inte registrera kunden. Kontrollera att namn, e-post och telefonnummer är korrekt ifyllda.",
          500: "Tjänsten för kunder kan ej nås just nu.",
        });
        window.location.href = "/customers.html";
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
